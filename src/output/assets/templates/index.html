<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #282828;
            --surface: #3c3836;
            --surface-hover: #504945;
            --border: #504945;
            --text: #ebdbb2;
            --text-dim: #bdae93;
            --gray: #928374;
            --blue: #83a598;
            --green: #b8bb26;
            --yellow: #fabd2f;
            --purple: #d3869b;
            --red: #fb4934;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f9f5d7;
                --surface: #fbf1c7;
                --surface-hover: #f2e5bc;
                --border: #d5c4a1;
                --text: #3c3836;
                --text-dim: #7c6f64;
                --gray: #928374;
                --blue: #076678;
                --green: #79740e;
                --yellow: #b57614;
                --purple: #8f3f71;
                --red: #9d0006;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .page {
            width: min(920px, calc(100vw - 2rem));
            margin: 0 auto;
            padding: 2rem 0 3rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .page-title {
            margin: 0;
            font-size: clamp(1.4rem, 2vw, 1.8rem);
            line-height: 1.2;
            font-weight: 700;
        }

        .page-timestamp {
            color: var(--text-dim);
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .event-list {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid var(--border);
            background: var(--surface);
        }

        .event-row {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.12s ease;
        }

        .event-row:last-child {
            border-bottom: 0;
        }

        .event-row:hover {
            background: var(--surface-hover);
        }

        .event-line {
            margin: 0;
            font-family: "Fira Mono", monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .event-push { color: var(--blue); }
        .event-create { color: var(--green); }
        .event-delete { color: var(--red); }
        .event-issue-comment { color: var(--yellow); }
        .event-pull-request { color: var(--purple); }
        .event-release { color: var(--green); }

        .page-footer {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .page {
                width: min(100vw - 1rem, 920px);
                padding-top: 1.25rem;
            }

            .page-header {
                margin-bottom: 1rem;
            }

            .event-row {
                padding: 0.75rem 0.85rem;
            }

            .event-line {
                font-size: 0.84rem;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="page-header">
            <h1 class="page-title"><a href="{{ user_url }}" target="_blank" rel="noopener noreferrer">@{{ username }}</a> recent activity</h1>
            <div class="page-timestamp">Generated at {{ timestamp }}</div>
        </header>

        <main>
            <ul class="event-list">
                {%- for event in events %}
                <li class="event-row">
                    <p class="event-line event-{{ event.event_kind }}">{{ event.timestamp }} {% for fragment in event.fragments %}{% if fragment.url %}<a href="{{ fragment.url }}" target="_blank" rel="noopener noreferrer">{{ fragment.text }}</a>{% else %}{{ fragment.text }}{% endif %}{% endfor %}</p>
                </li>
                {%- endfor %}
            </ul>
        </main>

        <footer class="page-footer">Built using <a href="https://github.com/dhth/ghlog" target="_blank" rel="noopener noreferrer">ghlog</a></footer>
    </div>
</body>
</html>
